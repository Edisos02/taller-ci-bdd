name: CI - Maven + JUnit + Cucumber

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Stage 1: Build
      - name: "Stage 1 - Build: compilar proyecto"
        run: mvn -B clean compile

      # Stage 2: Pruebas automatizadas (unitarias + integración + BDD)
      - name: "Stage 2 - Test: ejecutar pruebas unitarias e integración"
        run: mvn -B test

      - name: Generar reporte HTML de Surefire
        if: always()
        run: mvn surefire-report:report

      - name: Publicar resultados JUnit
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          check_name: 'Resultados JUnit y Cucumber'

      - name: Publicar reporte HTML de Surefire como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-html-report
          path: target/site/surefire-report.html

      - name: Publicar reporte HTML de Cucumber como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber-report.html